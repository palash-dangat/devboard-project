name : Sonarqube scan

on: 
    workflow_call:

jobs:
    sonarqube-scan:
        runs-on: ubuntu-latest
        steps:
            -name :code checkout
            uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.2 
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SOONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
