name : Sonarqube scan

on: 
    workflow_call:

jobs:
    sonarqube-scan:
        runs-on: ubuntu-latest
        steps:
            - name : code checkout
              uses : actions/checkout@v7
              with:
                fetch-depth: 0

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.2 
              with:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
