name: Docker Push

on: 
    workflow_call:

jobs:
    build-and-push:
        needs: [lint, test]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: 
                folders: ['backend','frontend']
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./${{ matrix.folders}}
                push: true
                tags: |
                  ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}:latest
                  ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ github.sha }}

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@0.24.0
              with:
                image-ref: '${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ github.sha }}'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
                